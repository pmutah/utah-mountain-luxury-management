# Cloudflare Pages project config (used by wrangler pages deploy from web/)
name = "wilhite-portfolio"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"

# Persistent extra cleaning fees (Cloudflare KV)
[[kv_namespaces]]
binding = "SETTINGS"
id = "a211af7ec8bd4c2e973d6421cccd8beb"

# Optional: set DASHBOARD_PASSWORD in Pages → Settings → Environment variables to enable auth
# Muse (Meta) and Amanda (Grok bot) full API.
# Set MUSE_BOT_SECRET and optionally AMANDA_BOT_SECRET.
# Either bearer works on /api/muse/*, /api/amanda/*, and every other /api/* route.
