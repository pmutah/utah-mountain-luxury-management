# Cloudflare Pages project config (used by wrangler pages deploy from web/)
name = "wilhite-portfolio"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"

# Create namespace: npx wrangler kv namespace create SETTINGS
# Then replace id below (preview_id for local dev optional)
[[kv_namespaces]]
binding = "SETTINGS"
id = "00000000000000000000000000000000"

[env.production]
# API runs as Pages Functions on the same origin — no VITE_API_URL needed
# Set DASHBOARD_PASSWORD in Pages → Settings → Environment variables to enable auth
