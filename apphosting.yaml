# Firebase App Hosting — serves NestJS API + React static build (Dockerfile)
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: FIREBASE_PROJECT_ID
    value: wilhite-portfolio
    availability:
      - RUNTIME
  - variable: CORS_ORIGINS
    value: https://wilhite-portfolio--wilhite-portfolio.us-central1.hosted.app,https://wilhite-portfolio.pages.dev,http://localhost:5173
    availability:
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
