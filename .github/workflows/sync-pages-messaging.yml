name: Sync Pages messaging env

on:
  workflow_dispatch:

jobs:
  sync:
    name: Put Gmail OAuth and Twilio on Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install wrangler
        working-directory: .
        run: npm ci --workspace web || npm install --workspace web
      - name: Put production secrets
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          UML_TWILIO_SMS_FROM: ${{ secrets.UML_TWILIO_SMS_FROM }}
        run: |
          set -euo pipefail
          put() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Skipping $name (empty)"
              return 0
            fi
            printf '%s' "$value" | npx wrangler pages secret put "$name" --project-name wilhite-portfolio
          }
          put GOOGLE_OAUTH_CLIENT_ID "$GOOGLE_OAUTH_CLIENT_ID"
          put GOOGLE_OAUTH_CLIENT_SECRET "$GOOGLE_OAUTH_CLIENT_SECRET"
          put TWILIO_ACCOUNT_SID "$TWILIO_ACCOUNT_SID"
          put TWILIO_AUTH_TOKEN "$TWILIO_AUTH_TOKEN"
          put UML_TWILIO_SMS_FROM "$UML_TWILIO_SMS_FROM"
          put TWILIO_SMS_FROM "$UML_TWILIO_SMS_FROM"
