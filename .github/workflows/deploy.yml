name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root & web dependencies
        working-directory: .
        run: npm ci --workspace web || npm install --workspace web

      - name: Build web
        run: npm run build

      - name: Deploy to Cloudflare Pages (with Functions)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=wilhite-portfolio --commit-dirty=true

      - name: Set Muse bot secret on Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MUSE_BOT_SECRET: ${{ secrets.MUSE_BOT_SECRET }}
        run: printf '%s' "$MUSE_BOT_SECRET" | npx wrangler pages secret put MUSE_BOT_SECRET --project-name=wilhite-portfolio

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --workspace api || npm install --workspace api
          npm run build -w api

